<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09070d">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<title>Money Need To Receive — Tamilanda Wallet 👑</title>

<style>
:root{
  --bg:#09070d;
  --surface:#15111d;
  --surface2:#1c1725;
  --edge:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#b7b2bf;
  --dim:#77717f;
  --purple:#9b6dff;
  --green:#55d98b;
  --red:#ff667a;
  --blue:#55aaff;
  --gold:#ffc857;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 95% 8%,rgba(92,82,255,.16),transparent 30%),
    radial-gradient(circle at 5% 20%,rgba(0,117,255,.07),transparent 26%),
    linear-gradient(180deg,#0a0d1e 0%,#061625 50%,#04090e 100%);
  -webkit-font-smoothing:antialiased;
}
.r-page{width:min(100%,720px);margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom));box-sizing:border-box}
.r-header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.r-back,.r-add{width:42px;height:42px;flex:0 0 42px;border-radius:13px;border:1px solid var(--edge);color:#fff;display:grid;place-items:center;cursor:pointer}
.r-back{background:rgba(255,255,255,.045);font-size:22px}
.r-add{margin-left:auto;background:linear-gradient(135deg,#9b6dff,#713fff);box-shadow:0 8px 22px rgba(113,63,255,.18);font-size:22px}
.r-heading{min-width:0}.r-heading h1{margin:0;font-size:22px;line-height:1.05;font-weight:900;letter-spacing:-.4px}.r-heading p{margin:5px 0 0;color:var(--muted);font-size:10px}
.r-hero{position:relative;overflow:hidden;padding:18px;border-radius:21px;border:1px solid rgba(155,109,255,.34);background:radial-gradient(circle at 90% 18%,rgba(42,112,255,.35),transparent 34%),radial-gradient(circle at 17% 118%,rgba(123,51,255,.42),transparent 38%),linear-gradient(145deg,#18112c,#0d0b16 76%);box-shadow:0 15px 44px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04);margin-bottom:14px}
.r-hero-label{color:var(--muted);font-size:11px}.r-hero-value{font-size:28px;font-weight:950;margin-top:5px}.r-hero-sub{color:var(--dim);font-size:10px;margin-top:5px}
.r-list{display:grid;gap:10px}
.r-card{background:rgba(21,17,29,.92);border:1px solid var(--edge);border-radius:17px;padding:15px;box-shadow:0 8px 25px rgba(0,0,0,.16)}
.r-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.r-name{font-weight:850;font-size:15px}.r-note{color:var(--muted);font-size:10px;margin-top:4px}.r-amount{text-align:right}.r-remaining{font-weight:900;font-size:16px;color:var(--green)}.r-total{color:var(--dim);font-size:9px;margin-top:3px}
.r-progress{height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:12px 0 10px}.r-progress span{display:block;height:100%;background:linear-gradient(90deg,#55d98b,#55aaff);border-radius:inherit}
.r-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.r-actions{display:flex;gap:8px;margin-top:12px}.r-btn{border:1px solid var(--edge);background:var(--surface2);color:#fff;border-radius:11px;padding:9px 12px;font-weight:750;cursor:pointer}.r-btn.primary{background:linear-gradient(135deg,#9b6dff,#713fff);border-color:transparent}.r-empty{text-align:center;padding:34px 18px;color:var(--muted);background:rgba(21,17,29,.78);border:1px dashed var(--edge);border-radius:17px}.r-empty strong{display:block;color:#fff;font-size:15px;margin-bottom:6px}.r-empty span{font-size:11px}
.r-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:20000;padding:12px}.r-modal.show{display:flex}.r-sheet{width:min(100%,600px);max-height:88vh;overflow:auto;background:#11101a;border:1px solid var(--edge);border-radius:22px 22px 14px 14px;padding:18px;box-sizing:border-box;box-shadow:0 -15px 55px rgba(0,0,0,.4)}.r-sheet h2{margin:0 0 14px;font-size:18px}.r-field{margin-bottom:11px}.r-field label{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.r-field input,.r-field select,.r-field textarea{width:100%;box-sizing:border-box;background:#0b0a11;color:#fff;border:1px solid var(--edge);border-radius:11px;padding:11px 12px;outline:none}.r-field textarea{min-height:72px;resize:vertical}.r-form-actions{display:flex;gap:9px;margin-top:14px}.r-form-actions button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--edge);background:var(--surface2);color:#fff;font-weight:800}.r-form-actions .save{background:linear-gradient(135deg,#9b6dff,#713fff);border-color:transparent}
</style>
</head>
<body>
<main class="r-page">
  <header class="r-header">
    <button class="r-back" type="button" onclick="goMore()" aria-label="Back">‹</button>
    <div class="r-heading">
      <h1>Money Need To Receive</h1>
      <p>Track money people need to pay you</p>
    </div>
    <button class="r-add" type="button" onclick="openAdd()" aria-label="Add receivable">+</button>
  </header>

  <section class="r-hero">
    <div class="r-hero-label">Total Pending</div>
    <div class="r-hero-value" id="totalPending">₹0.00</div>
    <div class="r-hero-sub" id="countText">0 pending records</div>
  </section>

  <section id="receivableList" class="r-list"></section>
</main>

<nav class="bottom-nav" aria-label="Primary navigation">
  <a class="nav-item" data-page="home" href="../index.html"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a class="nav-item" data-page="myIds" href="./my-ids.html"><span class="nav-icon">🆔</span><span class="nav-label">My IDs</span></a>
  <a class="nav-item" data-page="buyers" href="./buyers.html"><span class="nav-icon">💳</span><span class="nav-label">EMI Buyers</span></a>
  <a class="nav-item" data-page="accounts" href="./accounts.html"><span class="nav-icon">🏦</span><span class="nav-label">Accounts</span></a>
  <a class="nav-item active" data-page="more" href="./more.html"><span class="nav-icon">☰</span><span class="nav-label">More</span></a>
</nav>

<div class="r-modal" id="addModal">
  <form class="r-sheet" onsubmit="saveReceivable(event)">
    <h2>Add Money Need To Receive</h2>
    <div class="r-field"><label>Name *</label><input id="rName" required maxlength="80" placeholder="Person / customer name"></div>
    <div class="r-field"><label>Number (Optional)</label><input id="rPhone" type="tel" maxlength="20" placeholder="Phone number"></div>
    <div class="r-field"><label>Total Amount *</label><input id="rAmount" type="number" min="0.01" step="0.01" required placeholder="0"></div>
    <div class="r-field"><label>Due Date (Optional)</label><input id="rDueDate" type="date"></div>
    <div class="r-field"><label>Notes</label><textarea id="rNotes" maxlength="500" placeholder="Notes"></textarea></div>
    <div class="r-form-actions">
      <button type="button" onclick="closeAdd()">Cancel</button>
      <button class="save" type="submit">Save</button>
    </div>
  </form>
</div>

<div class="r-modal" id="payModal">
  <form class="r-sheet" onsubmit="savePayment(event)">
    <h2>Record Payment</h2>
    <div id="payPerson" class="r-note" style="margin-bottom:12px"></div>
    <div class="r-field"><label>Amount *</label><input id="payAmount" type="number" min="0.01" step="0.01" required></div>
    <div class="r-field"><label>Received Into Account *</label><select id="payAccount" required></select></div>
    <div class="r-field"><label>Date</label><input id="payDate" type="date"></div>
    <div class="r-field"><label>Notes</label><textarea id="payNotes" maxlength="300"></textarea></div>
    <div class="r-form-actions">
      <button type="button" onclick="closePay()">Cancel</button>
      <button class="save" type="submit">Save Payment</button>
    </div>
  </form>
</div>

<script src="../js/app.js"></script>
<script>
(function(){
  "use strict";
  let activeId = null;

  function api(){ return window.TamilandaWallet || {}; }
  function data(){ return api().getData ? (api().getData() || {}) : {}; }
  function money(v){
    return api().formatMoney ? api().formatMoney(Number(v)||0) : "₹"+(Number(v)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function remaining(r){
    return api().getReceivableRemaining ? Number(api().getReceivableRemaining(r))||0 : Math.max(0,Number(r.totalAmount||0)-Number(r.alreadyPaid||0));
  }
  function escape(s){
    return api().escapeHtml ? api().escapeHtml(String(s??"")) : String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  window.goMore=function(){
    if(api().goToPage) api().goToPage("more");
    else location.href="./more.html";
  };
  window.openAdd=function(){ document.getElementById("addModal").classList.add("show"); };
  window.closeAdd=function(){ document.getElementById("addModal").classList.remove("show"); };
  window.closePay=function(){ document.getElementById("payModal").classList.remove("show"); activeId=null; };

  window.saveReceivable=function(e){
    e.preventDefault();
    if(!api().addReceivable){ alert("Receivable feature is not available in app.js."); return; }
    const name=document.getElementById("rName").value.trim();
    const amount=Number(document.getElementById("rAmount").value);
    if(!name || !(amount>0)){ alert("Please enter name and valid amount."); return; }
    api().addReceivable({
      name,
      phone:document.getElementById("rPhone").value.trim(),
      totalAmount:amount,
      dueDate:document.getElementById("rDueDate").value,
      notes:document.getElementById("rNotes").value.trim()
    });
    document.querySelector("#addModal form").reset();
    closeAdd();
    render();
  };

  window.openPay=function(id){
    const d=data(), r=(d.receivables||[]).find(x=>String(x.id)===String(id));
    if(!r) return;
    const left=remaining(r);
    if(left<=0){ alert("This receivable is already fully received."); return; }
    activeId=id;
    document.getElementById("payPerson").textContent=r.name+" • Pending "+money(left);
    document.getElementById("payAmount").value="";
    document.getElementById("payAmount").max=left;
    document.getElementById("payDate").value=api().todayString ? api().todayString() : new Date().toISOString().slice(0,10);
    document.getElementById("payNotes").value="";
    const select=document.getElementById("payAccount");
    select.innerHTML="";
    (d.accounts||[]).forEach(a=>{
      const o=document.createElement("option"); o.value=a.id; o.textContent=(a.name||"Account")+" • "+money(a.balance); select.appendChild(o);
    });
    if(!select.options.length){ alert("Please add an account first."); return; }
    document.getElementById("payModal").classList.add("show");
  };

  window.savePayment=function(e){
    e.preventDefault();
    if(!activeId || !api().addReceivablePayment){ alert("Payment feature is not available in app.js."); return; }
    const amount=Number(document.getElementById("payAmount").value);
    const accountId=document.getElementById("payAccount").value;
    const r=(data().receivables||[]).find(x=>String(x.id)===String(activeId));
    if(!r){ closePay(); return; }
    const left=remaining(r);
    if(!(amount>0) || amount>left){ alert("Enter an amount up to "+money(left)+"."); return; }
    const ok=api().addReceivablePayment(activeId,amount,accountId,document.getElementById("payDate").value,document.getElementById("payNotes").value.trim());
    if(ok===false){ alert("Could not save payment."); return; }
    closePay();
    render();
  };

  function render(){
    const d=data(), list=d.receivables||[];
    let total=0,pending=0;
    list.forEach(r=>{const left=remaining(r); total+=left; if(left>0) pending++;});
    document.getElementById("totalPending").textContent=money(total);
    document.getElementById("countText").textContent=pending+" pending record"+(pending===1?"":"s");

    const box=document.getElementById("receivableList");
    const active=list.filter(r=>remaining(r)>0);
    if(!active.length){
      box.innerHTML='<div class="r-empty"><strong>No pending receivables</strong><span>Add money that someone needs to pay you.</span></div>';
      return;
    }
    box.innerHTML=active.map(r=>{
      const left=remaining(r), totalAmt=Number(r.totalAmount)||0, paid=Math.max(0,totalAmt-left), pct=totalAmt>0?Math.min(100,(paid/totalAmt)*100):0;
      return '<article class="r-card">'+
        '<div class="r-top"><div><div class="r-name">'+escape(r.name)+'</div>'+
        (r.phone?'<div class="r-note">'+escape(r.phone)+'</div>':'')+
        (r.dueDate?'<div class="r-note">Due: '+escape(r.dueDate)+'</div>':'')+
        '</div><div class="r-amount"><div class="r-remaining">'+money(left)+'</div><div class="r-total">of '+money(totalAmt)+'</div></div></div>'+
        '<div class="r-progress"><span style="width:'+pct+'%"></span></div>'+
        '<div class="r-meta"><span>Received '+money(paid)+'</span><span>'+Math.round(pct)+'%</span></div>'+
        '<div class="r-actions"><button class="r-btn primary" type="button" onclick="openPay('+JSON.stringify(String(r.id))+')">Receive Payment</button></div>'+
        (r.notes?'<div class="r-note" style="margin-top:10px">'+escape(r.notes)+'</div>':'')+
        '</article>';
    }).join("");
  }

  document.addEventListener("DOMContentLoaded",render);
  window.addEventListener("pageshow",render);
  window.addEventListener("storage",render);
})();
</script>
</body>
</html>
