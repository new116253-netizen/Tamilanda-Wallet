  </style>
</head>

<body>
<main class="accounts-page">

  <header class="accounts-header">
    <button class="accounts-back" type="button" onclick="goBack()" aria-label="Back">‹</button>

      <h1>Accounts 🏦</h1>
      <p>Manage your bank, cash, UPI & wallet balances</p>
    </div>
    <button class="accounts-add" id="addAccountBtn" type="button" aria-label="Add account">＋</button>
  </header>

  <section class="accounts-hero">
    <div class="accounts-hero-label">Total Available Balance</div>
    <div class="accounts-hero-amount" id="totalBalance">₹0.00</div>
    <div class="accounts-hero-note">Money currently available across all your accounts</div>

      <div class="accounts-mini count"><span>Total Accounts</span><strong id="accountCount">0</strong></div>

        <option value="all">All Types</option>
        <option value="Bank">Bank</option>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Wallet">Wallet</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </section>

  <div class="accounts-list-head">
    <h2>Your Accounts</h2>
    <span class="accounts-list-count" id="visibleCount">0 accounts</span>

</main>

<!-- Fixed Add/Edit Account Sheet -->
<div class="accounts-modal" id="accountModal" aria-hidden="true">
  <div class="accounts-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="accounts-sheet-head">
      <h2 id="modalTitle">Add Account</h2>
      <button class="accounts-close" id="closeModalBtn" type="button" aria-label="Close">✕</button>
    </div>

    <div class="accounts-error" id="formError"></div>

    <form class="accounts-form" id="accountForm">
      <div class="accounts-field">
        <label for="accountName">Account Name</label>
        <input id="accountName" type="text" maxlength="60" placeholder="Example: HDFC Bank" required>
      </div>

      <div class="accounts-field">
        <label for="accountType">Account Type</label>
        <select id="accountType">
          <option value="Bank">Bank</option>
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Wallet">Wallet</option>
          <option value="Credit Card">Credit Card</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="accounts-field">
        <label for="accountBalance">Current Balance</label>
        <input id="accountBalance" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
      </div>

      <div class="accounts-field">
        <label for="accountNote">Note <span style="color:var(--dim)">(Optional)</span></label>
        <input id="accountNote" type="text" maxlength="200" placeholder="Optional note">
      </div>

      <div class="accounts-form-actions">
        <button class="accounts-cancel" id="cancelModalBtn" type="button">Cancel</button>
        <button class="accounts-save" id="saveAccountBtn" type="submit">Save Account</button>
      </div>
    </form>
  </div>
</div>

<script>
  "use strict";


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const accountList =
    document.getElementById(
      "accountList"
    );

  const totalBalance =
    document.getElementById(
      "totalBalance"
    );

  const accountCount =
    document.getElementById(
      "accountCount"
    );

  const positiveBalance =
    document.getElementById(
      "positiveBalance"
    );

  const visibleCount =
    document.getElementById(
      "visibleCount"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const typeFilter =
    document.getElementById(
      "typeFilter"
    );

  const modal =
    document.getElementById(
      "accountModal"
    );

  const modalTitle =
    document.getElementById(
      "modalTitle"
    );

  const accountForm =
    document.getElementById(
      "accountForm"
    );

  const accountName =
    document.getElementById(
      "accountName"
    );

  const accountType =
    document.getElementById(
      "accountType"
    );

  const accountBalance =
    document.getElementById(
      "accountBalance"
    );

  const accountNote =
    document.getElementById(
      "accountNote"
    );

  const formError =
    document.getElementById(
      "formError"
    );


  let walletData = null;

  let editingAccountId = null;


  /* =====================================================
     DATA
     ===================================================== */

  function getData() {

    if (
      window.TamilandaWallet &&
      typeof window.TamilandaWallet.getData === "function"
    ) {

      return window.TamilandaWallet.getData();

    }


    try {

      return JSON.parse(
        localStorage.getItem(
          "tamilanda_wallet_data"
        )
      ) || {
        accounts: []
      };

    } catch (error) {

      return {
        accounts: []
      };

    }

  }


  function saveData() {

    if (
      window.TamilandaWallet &&
      typeof window.TamilandaWallet.save === "function"
    ) {

      window.TamilandaWallet.save();

    } else {

      localStorage.setItem(
        "tamilanda_wallet_data",
        JSON.stringify(walletData)
      );

    }

  }


  function money(value) {

    if (
      window.TamilandaWallet &&
      typeof window.TamilandaWallet.formatMoney === "function"
    ) {

      return window.TamilandaWallet.formatMoney(
        Number(value || 0)
      );

    }


    return (
      "₹" +
      Number(value || 0)
        .toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
    );

  }


  function getBalance(account) {

    return Number(
      account.balance ??
      account.currentBalance ??
      0
    );

  }


  function getName(account) {

    return (
      account.name ||
      account.accountName ||
      account.title ||
      "Unnamed Account"
    );

  }


  function iconForType(type) {

    const icons = {

      "Bank": "🏦",

      "Cash": "💵",

      "UPI": "📱",

      "Wallet": "👛",

      "Credit Card": "💳",

      "Other": "💰"

    };

    return icons[type] || "💰";

  }


  /* =====================================================
     SUMMARY
     ===================================================== */

  function renderSummary(accounts) {

    const total =
      accounts.reduce(
        (sum, account) =>
          sum + getBalance(account),
        0
      );


    const positive =
      accounts.reduce(
        (sum, account) => {

          const balance =
            getBalance(account);

          return (
            sum +
            (balance > 0
              ? balance
              : 0)
          );

        },
        0
      );


    totalBalance.textContent =
      money(total);

    positiveBalance.textContent =
      money(positive);

    accountCount.textContent =
      accounts.length;

  }


  /* =====================================================
     FILTER
     ===================================================== */

  function getFilteredAccounts() {

    walletData = getData();

    const accounts =
      Array.isArray(
        walletData.accounts
      )
        ? walletData.accounts
        : [];


    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    const type =
      typeFilter.value;


    return accounts.filter(
      account => {

        const name =
          getName(account)
            .toLowerCase();

        const accountTypeValue =
          String(
            account.type ||
            "Other"
          );


        const matchesSearch =
          !search ||
          name.includes(search) ||
          accountTypeValue
            .toLowerCase()
            .includes(search);


        const matchesType =
          type === "all" ||
          accountTypeValue === type;


        return (
          matchesSearch &&
          matchesType
        );

      }
    );

  }


  /* =====================================================
     RENDER
     ===================================================== */

  function renderAccounts() {

    walletData = getData();

    const allAccounts =
      Array.isArray(
        walletData.accounts
      )
        ? walletData.accounts
        : [];


    const accounts =
      getFilteredAccounts();


    renderSummary(
      allAccounts
    );


    visibleCount.textContent =
      `${accounts.length} ${
        accounts.length === 1
          ? "account"
          : "accounts"
      }`;


    if (
      allAccounts.length === 0
    ) {

      accountList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            🏦
          </div>

          <strong>
            No accounts yet
          </strong>

          <p>
            Add your bank, cash, UPI or wallet
            account to start managing your balance.
          </p>

        </div>
      `;

      return;

    }


    if (
      accounts.length === 0
    ) {

      accountList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            🔎
          </div>

          <strong>
            No matching accounts
          </strong>

          <p>
            Try another search or filter.
          </p>

        </div>
      `;

      return;

    }


    accountList.innerHTML =
      accounts
        .map(account => {

          const id =
            String(account.id);

          const name =
            getName(account);

          const type =
            account.type ||
            "Other";

          const balance =
            getBalance(account);

          const note =
            account.note ||
            "";


          return `
            <div
              class="account-card"
              data-id="${escapeHtml(id)}"
            >

              <div class="account-top">

                <div class="account-info">

                  <div class="account-icon">
                    ${iconForType(type)}
                  </div>

                  <div>

                    <div class="account-name">
                      ${escapeHtml(name)}
                    </div>

                    <div class="account-type">
                      ${escapeHtml(type)}
                    </div>

                  </div>

                </div>


                <div class="account-balance">
                  ${escapeHtml(
                    money(balance)
                  )}
                </div>

              </div>


              ${
                note
                  ? `
                    <div class="account-note">
                      ${escapeHtml(note)}
                    </div>
                  `
                  : ""
              }


              <div class="account-actions">

                <button
                  type="button"
                  class="action-btn transfer"
                  data-action="transfer"
                  data-id="${escapeHtml(id)}"
                >
                  ⇄ Transfer
                </button>

                <button
                  type="button"
                  class="action-btn"
                  data-action="edit"
                  data-id="${escapeHtml(id)}"
                >
                  ✎ Edit
                </button>

                <button
                  type="button"
                  class="action-btn delete"
                  data-action="delete"
                  data-id="${escapeHtml(id)}"
                >
                  🗑 Delete
                </button>

              </div>

            </div>
          `;

        })
        .join("");

  }


  function escapeHtml(value) {

    if (
      window.TamilandaWallet &&
      typeof window.TamilandaWallet.escapeHtml === "function"
    ) {

      return window.TamilandaWallet.escapeHtml(
        value
      );

    }


    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     MODAL
     ===================================================== */

  function openAddModal() {

    editingAccountId = null;

    modalTitle.textContent =
      "Add Account";

    accountForm.reset();

    accountType.value =
      "Bank";

    accountBalance.value =
      "0";

    formError.style.display =
      "none";

    modal.classList.add(
      "show"
    );

    setTimeout(
      () => accountName.focus(),
      100
    );

  }


  function openEditModal(account) {

    if (!account) {
      return;
    }


    editingAccountId =
      String(account.id);


    modalTitle.textContent =
      "Edit Account";


    accountName.value =
      getName(account);


    accountType.value =
      account.type ||
      "Other";


    accountBalance.value =
      getBalance(account);


    accountNote.value =
      account.note ||
      "";


    formError.style.display =
      "none";


    modal.classList.add(
      "show"
    );

  }


  function closeModal() {

    modal.classList.remove(
      "show"
    );

    editingAccountId = null;

  }


  function showFormError(message) {

    formError.textContent =
      message;

    formError.style.display =
      "block";

  }


  /* =====================================================
     SAVE ACCOUNT
     ===================================================== */

  accountForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      walletData = getData();


      if (
        !Array.isArray(
          walletData.accounts
        )
      ) {

        walletData.accounts = [];

      }


      const name =
        accountName.value
          .trim();


      const type =
        accountType.value;


      const balance =
        Number(
          accountBalance.value
        );


      const note =
        accountNote.value
          .trim();


      if (!name) {

        showFormError(
          "Please enter an account name."
        );

        return;

      }


      if (
        !Number.isFinite(balance) ||
        balance < 0
      ) {

        showFormError(
          "Please enter a valid balance."
        );

        return;

      }


      /* EDIT */

      if (editingAccountId) {

        const account =
          walletData.accounts.find(
            item =>
              String(item.id) ===
              String(editingAccountId)
          );


        if (!account) {

          showFormError(
            "Account not found."
          );

          return;

        }


        account.name =
          name;

        account.type =
          type;

        account.balance =
          balance;

        account.note =
          note;


        saveData();

        closeModal();

        renderAccounts();

        return;

      }


      /* ADD */

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.addAccount === "function"
      ) {

        const created =
          window.TamilandaWallet.addAccount({

            name: name,

            type: type,

            balance: balance,

            note: note

          });


        if (!created) {

          showFormError(
            "Could not create account."
          );

          return;

        }

      } else {

        walletData.accounts.push({

          id:
            "account_" +
            Date.now(),

          name:
            name,

          type:
            type,

          balance:
            balance,

          note:
            note,

          createdAt:
            new Date().toISOString()

        });


        saveData();

      }


      closeModal();

      renderAccounts();

    }
  );


  /* =====================================================
     ACCOUNT ACTIONS
     ===================================================== */

  accountList.addEventListener(
    "click",
    function(event) {

      const button =
        event.target.closest(
          "[data-action]"
        );


      if (!button) {
        return;
      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      walletData =
        getData();


      const account =
        walletData.accounts.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!account) {

        alert(
          "Account not found."
        );

        return;

      }


      /* TRANSFER */

      if (
        action ===
        "transfer"
      ) {

        window.location.href =
          `transfer.html?from=${encodeURIComponent(id)}`;

        return;

      }


      /* EDIT */

      if (
        action ===
        "edit"
      ) {

        openEditModal(
          account
        );

        return;

      }


      /* DELETE */

      if (
        action ===
        "delete"
      ) {

        const name =
          getName(account);


        const balance =
          getBalance(account);


        const message =
          balance > 0
            ? `${name} has ${money(balance)} balance.\n\nAre you sure you want to move this account to Trash?`
            : `Are you sure you want to move "${name}" to Trash?`;


        if (
          !confirm(message)
        ) {

          return;

        }


        let deleted =
          false;


        if (
          window.TamilandaWallet &&
          typeof window.TamilandaWallet.deleteRecord === "function"
        ) {

          deleted =
            window.TamilandaWallet.deleteRecord(
              "accounts",
              id
            );

        } else {

          const index =
            walletData.accounts.findIndex(
              item =>
                String(item.id) ===
                String(id)
            );


          if (index !== -1) {

            const removed =
              walletData.accounts.splice(
                index,
                1
              )[0];


            if (
              !Array.isArray(
                walletData.trash
              )
            ) {

              walletData.trash = [];

            }


            walletData.trash.unshift({

              id:
                "trash_" +
                Date.now(),

              originalId:
                removed.id,

              type:
                "accounts",

              data:
                JSON.parse(
                  JSON.stringify(
                    removed
                  )
                ),

              deletedAt:
                new Date().toISOString()

            });


            saveData();

            deleted = true;

          }

        }


        if (deleted) {

          renderAccounts();

        }

      }

    }
  );

  document
