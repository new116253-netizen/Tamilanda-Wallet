<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09070d">
  <link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
  <title>More — Tamilanda Wallet 👑</title>

  <style>
    :root{
      --bg:#09070d;--surface:#15111d;--surface2:#1c1725;
      --edge:rgba(255,255,255,.08);--text:#fff;--muted:#b7b2bf;--dim:#77717f;
      --purple:#9b6dff;--green:#55d98b;--red:#ff667a;--blue:#55aaff;--gold:#ffc857;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--text)}
    body{
      overflow-x:hidden;-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(circle at 95% 8%,rgba(92,82,255,.16),transparent 30%),
        radial-gradient(circle at 5% 20%,rgba(0,117,255,.07),transparent 26%),
        linear-gradient(180deg,#0a0d1e 0%,#061625 50%,#04090e 100%);
      padding-bottom:110px!important;
    }

    .more-page{
      width:min(100%,720px);
      margin:0 auto;
      padding:18px 16px calc(105px + env(safe-area-inset-bottom));
    }

    .more-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:15px 14px;margin-bottom:12px;border-radius:19px;
      background:rgba(21,17,29,.90);border:1px solid var(--edge);
    }
    .more-heading h1{margin:0;font-size:23px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
    .more-heading p{margin:5px 0 0;color:var(--muted);font-size:10px}

    .profile-card{
      background:linear-gradient(145deg,rgba(24,20,32,.97),rgba(14,12,20,.97));
      border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px;
      display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;
      box-shadow:0 8px 23px rgba(0,0,0,.12);
    }
    .profile-avatar{
      width:40px;height:40px;flex:0 0 40px;border-radius:12px;
      display:grid;place-items:center;font-size:20px;
      background:rgba(155,109,255,.10);border:1px solid rgba(155,109,255,.16);
    }
    .profile-name{font-size:14px;font-weight:900;color:#fff}
    .profile-sub{font-size:9px;color:var(--dim);margin-top:3px}

    .more-section-title{
      font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
      color:var(--dim);margin:17px 2px 8px;
    }
    .more-menu{
      background:rgba(21,17,29,.86);border:1px solid var(--edge);
      border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
      box-shadow:0 8px 23px rgba(0,0,0,.10);
    }
    .more-item{
      width:100%;min-height:64px;padding:12px 14px;display:flex;align-items:center;
      gap:10px;background:transparent;border:none;
      border-bottom:1px solid rgba(255,255,255,.05);color:#fff;
      cursor:pointer;text-align:left;
    }
    .more-item:last-child{border-bottom:none}
    .more-item:active{background:rgba(255,255,255,.04)}
    .more-icon{
      width:40px;height:40px;flex:0 0 40px;border-radius:12px;
      display:grid;place-items:center;font-size:19px;
    }
    .more-title{font-size:13px;font-weight:900;color:#fff}
    .more-desc{font-size:9px;color:var(--dim);margin-top:3px;line-height:1.35}
    .more-arrow{margin-left:auto;color:var(--dim);font-size:18px}

    @media(max-width:520px){
      .more-page{padding-left:13px;padding-right:13px}
    }
  </style>
</head>

<body>
<main class="more-page">

  <header class="more-header">
    <div class="more-heading">
      <h1>More ✨</h1>
      <p>Organized tools and wallet settings</p>
    </div>
  </header>

  <section class="profile-card" onclick="goToPage('profile')">
    <div class="profile-avatar">👤</div>
    <div style="min-width:0;flex:1">
      <div class="profile-name" id="profileName">My Profile</div>
      <div class="profile-sub" id="profileSub">Manage personal profile details</div>
    </div>
    <span class="more-arrow">›</span>
  </section>

  <div class="more-section-title">Money & Records</div>
  <div class="more-menu">

    <button class="more-item" type="button" onclick="goToPage('buyers')">
      <div class="more-icon" style="background:rgba(16,216,139,.10);color:var(--green)">💳</div>
      <div>
        <div class="more-title">EMI Buyers</div>
        <div class="more-desc">Track buyer sales, EMIs & incoming payments</div>
      </div>
      <span class="more-arrow">›</span>
    </button>

    <!-- SEPARATE RECEIVABLE: NEVER ROUTES TO EMI BUYERS -->
    <button class="more-item" type="button" onclick="goToPage('receivables')">
      <div class="more-icon" style="background:rgba(85,170,255,.10);color:var(--blue)">💰</div>
      <div>
        <div class="more-title">Money Need To Receive</div>
        <div class="more-desc">Track separate receivables and incoming payments</div>
      </div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('giveMoney')">
      <div class="more-icon" style="background:rgba(255,102,122,.10);color:var(--red)">🤝</div>
      <div>
        <div class="more-title">Amounts to Give (Payables)</div>
        <div class="more-desc">Track personal loans you need to repay</div>
      </div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('transactions')">
      <div class="more-icon" style="background:rgba(85,170,255,.10);color:var(--blue)">📒</div>
      <div>
        <div class="more-title">Transactions Ledger</div>
        <div class="more-desc">Complete paid and received ledger</div>
      </div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('emi')">
      <div class="more-icon" style="background:rgba(255,200,87,.10);color:var(--gold)">🏍️</div>
      <div>
        <div class="more-title">My EMIs</div>
        <div class="more-desc">Loan commitments and payment tenures</div>
      </div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('reports')">
      <div class="more-icon" style="background:rgba(155,109,255,.10);color:var(--purple)">📊</div>
      <div>
        <div class="more-title">Reports & Analytics</div>
        <div class="more-desc">Visual cash flow breakdown by period</div>
      </div>
      <span class="more-arrow">›</span>
    </button>
  </div>

  <div class="more-section-title">Data & Safety</div>
  <div class="more-menu">
    <button class="more-item" type="button" onclick="goToPage('backup')">
      <div class="more-icon" style="background:rgba(255,255,255,.05)">☁️</div>
      <div><div class="more-title">Backup & Restore</div><div class="more-desc">Download or restore JSON wallet copies</div></div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('export')">
      <div class="more-icon" style="background:rgba(255,255,255,.05)">⇅</div>
      <div><div class="more-title">Import / Export (CSV)</div><div class="more-desc">Excel-ready spreadsheet exports</div></div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('trash')">
      <div class="more-icon" style="background:rgba(255,102,122,.10);color:var(--red)">🗑️</div>
      <div><div class="more-title">Trash</div><div class="more-desc">Restore or permanently delete records</div></div>
      <span class="more-arrow">›</span>
    </button>
  </div>

  <div class="more-section-title">Settings & About</div>
  <div class="more-menu">
    <button class="more-item" type="button" onclick="goToPage('privacy')">
      <div class="more-icon" style="background:rgba(85,170,255,.10);color:var(--blue)">🛡️</div>
      <div><div class="more-title">Privacy & Security</div><div class="more-desc">Manage local storage and security PIN</div></div>
      <span class="more-arrow">›</span>
    </button>

    <button class="more-item" type="button" onclick="goToPage('about')">
      <div class="more-icon" style="background:rgba(255,200,87,.10);color:var(--gold)">👑</div>
      <div><div class="more-title">About Tamilanda Wallet</div><div class="more-desc">Offline private money management</div></div>
      <span class="more-arrow">›</span>
    </button>
  </div>

</main>

<nav class="bottom-nav">
  <button type="button" class="nav-item" data-page="home" onclick="goToPage('home')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
  <button type="button" class="nav-item" data-page="myIds" onclick="goToPage('myIds')"><span class="nav-icon">🆔</span><span class="nav-label">My IDs</span></button>
  <button type="button" class="nav-item" data-page="buyers" onclick="goToPage('buyers')"><span class="nav-icon">💳</span><span class="nav-label">EMI Buyers</span></button>
  <button type="button" class="nav-item" data-page="accounts" onclick="goToPage('accounts')"><span class="nav-icon">🏦</span><span class="nav-label">Accounts</span></button>
  <button type="button" class="nav-item active" data-page="more" onclick="goToPage('more')"><span class="nav-icon">☰</span><span class="nav-label">More</span></button>
</nav>

<script src="../js/app.js"></script>
<script>
(() => {
  "use strict";
  function loadProfile(){
    const data=window.TamilandaWallet.getData();
    const p=data.profile||{};
    document.getElementById("profileName").textContent=p.name||"My Profile";
    document.getElementById("profileSub").textContent=p.phone||"Manage wallet profile details";
  }
  document.addEventListener("DOMContentLoaded",loadProfile);
})();
</script>
</body>
</html>
